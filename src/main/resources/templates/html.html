<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Stf-Puzzle Simplified Version</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; margin-top: 30px; }
        .container { background: white; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        .board { display: grid; gap: 2px; margin: 20px auto; background: #333; padding: 2px; width: 300px; height: 300px; }
        .tile { background: #ddd; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; cursor: pointer; user-select: none; }
        .tile.empty { background: white; cursor: default; }
        .btn { background: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-size: 16px; }
        .btn:hover { background: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>Stf-Puzzle Simplified Version</h2>

    <div>
        <input type="file" id="imageFile" accept=".jpg" style="display:none;" onchange="uploadImage()">
        <button type="button" class="btn" onclick="document.getElementById('imageFile').click()">Seleccionar Personaje</button>
        <br><br>
        <input type="text" id="dimensions" placeholder="3x3" value="3x3" oninput="validateDimensions()">
        <br><br>
        <button type="button" id="startButton" class="btn" style="display:none;" onclick="startGame()">Iniciar el juego</button>
    </div>

    <div id="message" style="color: green; font-weight: bold; margin-top: 10px;"></div>
    <div class="board" id="puzzleBoard"></div>
</div>

<script>
    let currentStructure = "12345678X";

    function validateDimensions() {
        const val = document.getElementById('dimensions').value;
        const isValid = /^\d+x\d+$/.test(val);
        document.getElementById('startButton').style.display = isValid ? 'inline-block' : 'none';
    }
    validateDimensions();

    function loadState() {
        fetch('/api/puzzle/state')
        .then(res => res.json())
        .then(data => {
            currentStructure = data.stfGameBoardStructure;
            renderBoard();
        });
    }

    function uploadImage() {
        let formData = new FormData();
        let fileInput = document.getElementById('imageFile');
        if (fileInput.files.length > 0) {
            formData.append("file", fileInput.files[0]);
            fetch('/api/puzzle/upload', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.status === "error") {
                    alert(data.message);
                } else {
                    alert("Imagen cargada exitosamente.");
                }
            });
        }
    }

    function startGame() {
        const dims = document.getElementById('dimensions').value;
        fetch('/api/puzzle/start?dimensions=' + dims, { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            currentStructure = data.stfGameBoardStructure;
            renderBoard();
            document.getElementById('message').innerText = "";
        });
    }

    function renderBoard() {
        const boardEl = document.getElementById('puzzleBoard');
        boardEl.innerHTML = "";
        const dims = document.getElementById('dimensions').value.split('x');
        const rows = parseInt(dims[0]);
        const cols = parseInt(dims[1]);

        boardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        boardEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

        for (let i = 0; i < currentStructure.length; i++) {
            let tile = document.createElement('div');
            tile.className = 'tile';
            let char = currentStructure[i];
            if (char === 'X') {
                tile.classList.add('empty');
            } else {
                tile.innerText = char;
                tile.onclick = function() {
                    fetch(`/api/puzzle/move?index=${i}&rows=${rows}&cols=${cols}`, { method: 'POST' })
                    .then(res => res.json())
                    .then(response => {
                        if(response.status === 'finished') {
                            currentStructure = response.board;
                            renderBoard();
                            alert("¡Juego terminado !");
                            document.getElementById('message').innerText = "Juego terminado !";
                        } else if(response.status === 'success') {
                            currentStructure = response.board;
                    renderBoard();
                        }
                    });
                };
            }
            boardEl.appendChild(tile);
        }
    }

    // Charger l'état au démarrage de la page
    loadState();
</script>

</body>
</html>
